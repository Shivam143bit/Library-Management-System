<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Management System{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            padding-top: 20px;
            padding-bottom: 20px;
            background-color: #f995ae;
        }
        .navbar {
            margin-bottom: 30px;
        }
        .messages .alert {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <header class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-danger rounded shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="{% url 'book-list' %}">📚 Library System</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse text-black" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="{% url 'author-list' %}">Authors</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="{% url 'book-list' %}">Books</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="{% url 'borrow-list' %}">Borrow Records</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="{% url 'export-data' %}">Export Data</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
